[project]
name = "sphinxcontrib.nvd3"
version = "0.2.2"
description = "Sphinx chart extension using NVD3.js."
authors = [
    { name = "shkumagai", email = "take.this.2.your.grave@gmail.com" },
]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.rst"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Sphinx",
    "Framework :: Sphinx :: Extension",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Documentation",
    "Topic :: Documentation :: Sphinx",
    "Topic :: Software Development",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "Sphinx>=4.0",
    "python-nvd3>=0.15,<0.17",
]

[project.urls]
Homepage = "https://github.com/shkumagai/sphinxcontrib.nvd3"

[dependency-groups]
dev = [
    "bandit",
    "ruff",
    "tox>=4.25.0",
    "tox-uv>=1",
    "twine>=1.12.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88
indent-width = 4
extend-exclude = [".tox"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C90", # mccabe complexity
]
ignore = [
    "E203", # whitespace before ':'
    "E501", # line too long
    "E722", # bare except
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["sphinxcontrib"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/sphinxcontrib"]

[tool.hatch.build.targets.sdist]
include = [
    "src/sphinxcontrib",
    "AUTHORS.rst",
    "CHANGES.rst",
    "LICENSE",
    "README.rst",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
